<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iNeo Cases - Panel de Administración</title>
    
    <!-- Tailwind CSS (Diseño) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (Íconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SortableJS (Drag & Drop) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans antialiased">

    <!-- ========================================== -->
    <!-- PANTALLA DE CARGA                          -->
    <!-- ========================================== -->
    <div id="pantallaCarga" class="fixed inset-0 bg-white z-50 flex flex-col justify-center items-center transition-opacity duration-500">
        <div class="flex flex-col items-center space-y-4">
            <div class="flex items-center space-x-1 text-2xl font-bold tracking-wider text-black">
                <span>iNeo</span>
                <span class="border border-black px-1.5 py-0.5 text-xs rounded-md uppercase font-black">Cases</span>
            </div>
            <div class="w-48 h-1 bg-gray-200 rounded-full overflow-hidden">
                <div id="loaderProgreso" class="w-0 h-full bg-black transition-all duration-300"></div>
            </div>
            <p id="textoCarga" class="text-xs text-gray-400 mt-2">Conectando al panel...</p>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- ESTRUCTURA PRINCIPAL                       -->
    <!-- ========================================== -->
    <div class="flex h-screen overflow-hidden">

        <!-- SIDEBAR -->
        <aside class="w-64 bg-black text-white flex flex-col justify-between hidden md:flex">
            <div class="p-5">
                <div class="flex items-center space-x-1 text-xl font-bold tracking-wider mb-8">
                    <span>iNeo</span>
                    <span class="border border-white px-1.5 py-0.5 text-xs rounded-md uppercase font-black bg-white text-black">Admin</span>
                </div>
                <nav class="space-y-2">
                    <a href="#" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg bg-zinc-800 text-white font-medium transition">
                        <i class="fa-solid fa-box"></i>
                        <span>Inventario</span>
                    </a>
                    <!-- Botón que abre el modal de categorías -->
                    <button id="btnCategorias" class="w-full flex items-center space-x-3 px-4 py-2.5 rounded-lg text-zinc-400 hover:bg-zinc-900 hover:text-white font-medium transition text-left">
                        <i class="fa-solid fa-tags"></i>
                        <span>Categorías</span>
                    </button>
                    <a href="#" class="flex items-center space-x-3 px-4 py-2.5 rounded-lg text-zinc-400 hover:bg-zinc-900 hover:text-white font-medium transition">
                        <i class="fa-solid fa-users"></i>
                        <span>Clientes y Ventas</span>
                    </a>
                </nav>
            </div>
        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="flex-1 flex flex-col overflow-y-auto relative">
            
            <!-- HEADER -->
            <header class="bg-white border-b border-gray-200 px-6 py-4 flex items-center justify-between shadow-sm sticky top-0 z-10">
                <h1 class="text-xl font-bold text-gray-900">Inventario</h1>
                <button id="btnNuevaFunda" class="bg-black hover:bg-zinc-800 text-white text-sm font-medium px-4 py-2 rounded-lg shadow transition flex items-center space-x-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nuevo Item</span>
                </button>
            </header>

            <!-- DASHBOARD -->
            <div class="p-6 space-y-6 max-w-7xl w-full mx-auto">
                
                <!-- Buscador -->
                <div class="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex flex-col md:flex-row gap-4 justify-between items-center">
                    <div class="relative w-full md:w-96">
                        <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                        <input type="text" id="buscadorAdmin" placeholder="Buscar fundas por modelo..." class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-black">
                    </div>
                    <select id="filtroCategoria" class="w-full md:w-48 bg-white border border-gray-300 rounded-lg text-sm px-3 py-2 focus:outline-none focus:ring-2 focus:ring-black">
                        <option value="todos">Todas las categorías</option>
                    </select>
                </div>

                <!-- Lista de Productos -->
                <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-4">
                    <div class="border-b border-gray-100 pb-3 mb-4 flex justify-between items-center">
                        <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Productos (Arrastra para reordenar)</p>
                        <span class="text-xs bg-gray-100 text-gray-600 px-2 py-1 rounded-full font-medium" id="totalProductos">0 Items</span>
                    </div>
                    
                    <div id="contenedorProductosAdmin" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 min-h-[200px]">
                        <!-- Aquí admin.js inyecta los productos -->
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- ========================================== -->
    <!-- MODALES Y FLOTANTES                        -->
    <!-- ========================================== -->

    <!-- Modal Categorías -->
    <div id="modalCategorias" class="fixed inset-0 bg-black/50 z-50 flex justify-center items-center opacity-0 pointer-events-none transition-opacity duration-300 hidden">
        <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 m-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center border-b border-gray-200 pb-3 mb-4">
                <h3 class="text-lg font-bold text-gray-900">Categorías</h3>
                <button id="btnCerrarModalCat" class="text-gray-400 hover:text-gray-600 transition text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <form id="formNuevaCategoria" class="flex gap-2 mb-4">
                <input type="text" id="inputNuevaCategoria" placeholder="Ej: iPhone 15" required class="flex-1 px-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-black">
                <button type="submit" class="bg-black text-white text-sm font-medium px-4 py-2 rounded-lg transition">
                    Añadir
                </button>
            </form>

            <div class="flex-1 overflow-y-auto space-y-2" id="listaCategoriasAdmin">
                <!-- Aquí admin.js inyecta las categorías -->
            </div>
        </div>
    </div>

    <!-- Botón Asistente Flotante -->
    <button id="btnAsistente" class="fixed bottom-6 right-6 bg-black text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center text-xl transition-transform hover:scale-110 z-40">
        <i class="fa-solid fa-comments"></i>
    </button>

    <!-- ========================================== -->
    <!-- SCRIPTS                                    -->
    <!-- ========================================== -->
    
    <!-- Script principal del administrador -->
    <script src="admin.js" type="module"></script>

</body>
</html>
