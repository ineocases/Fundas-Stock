<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IneoCases Stock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de carga indispensable -->
  <div id="cargando" style="text-align: center; margin-top: 50px; font-family: Arial; font-size: 18px;">
    ⏳ Cargando aplicación...
  </div>

  <!-- El login -->
  <div id="login" style="display:none;">
    <h2>IneoCases Stock</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Contraseña">
    <button id="btnLogin">Ingresar</button>
  </div>

  <!-- La app principal -->
  <div id="app" style="display:none;">
    <h1>📱 IneoCases Stock</h1>
    <div class="top-bar">
      <input id="buscar" placeholder="Buscar iPhone 12, 13...">
      <button id="btnNuevaFunda">➕ Nueva funda</button>
    </div>

    <!-- FORMULARIO ESTILO MODAL -->
    <div id="agregar" style="display:none">
      <div class="modal-content">
        <h3 id="modalTitulo">Nueva Funda</h3>
        
        <label>Nombre del modelo/diseño</label>
        <input id="nombre" placeholder="Ej: Funda Silicona Púrpura">
        
        <!-- CAMBIO: Unificamos modelo y stock en un solo input explicativo -->
        <label>Modelos y Stock (Formato: modelo:cantidad)</label>
        <input id="stockPorModelo" placeholder="Ej: 11:3, 12:1, 14:4">
        
        <label>Costo de lista ($)</label>
        <input id="costo" type="number" placeholder="0">
        
        <label>Precio de venta ($)</label>
        <input id="venta" type="number" placeholder="0">
        
        <div class="modal-buttons">
          <button type="button" onclick="ocultarFormulario()" class="btn-secundario">Cancelar</button>
          <button id="guardarFunda">Guardar</button>
        </div>
      </div>
    </div>  
    
    <div id="fundas"></div>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
