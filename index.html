<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iNeo Cases - Gestión de Catálogo</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

  <div id="cargando" style="text-align: center; margin-top: 50px; font-family: Arial; font-size: 18px;">
    ⏳ Cargando aplicación...
  </div>

  <div id="login" style="display:none;">
    <div class="login-container">
      <div class="login-welcome">
        <div class="header-logo-welcome">
          <img src="logo.svg" alt="Logo" class="app-logo-welcome">
          <h1>iNeo Cases</h1>
          <p class="subtitle">Descubrí los mejores accesorios premium para tu dispositivo</p>
        </div>
        <button id="btnCliente" class="btn-principal-welcome">Entrar a ver Catálogo 📱</button>
      </div>
      
      <div class="admin-trigger-zone">
        <button type="button" id="btnAbrirAdminModal" class="btn-link-admin">🔒 Acceso Personal de Trabajo</button>
      </div>
    </div>

    <div id="modalAdminLogin" class="modal-admin-overlay" style="display: none;">
      <div class="modal-admin-content">
        <h3>Panel de Administración</h3>
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" placeholder="ejemplo@ineocases.com">
        <label for="password">Contraseña</label>
        <input id="password" type="password" placeholder="••••••••">
        <button id="btnLogin" class="btn-admin-submit">Ingresar 🔐</button>
        <button type="button" id="btnCerrarAdminModal" class="btn-secundario" style="width: 100%; margin-top: 8px;">Volver</button>
      </div>
    </div>
  </div>

  <div id="app" style="display:none;">
    <header class="header-logo">
      <div class="header-logo-left">
        <img src="logo.svg" alt="Logo" class="app-logo">
        <h1>iNeo Cases</h1>
      </div>
      <button id="btnMenuHamburguesa" class="menu-hamburguesa"><span></span><span></span><span></span></button>
    </header>
    
    <div class="top-bar">
      <input id="buscar" placeholder="Buscar producto o modelo...">
      <button id="btnNuevaFunda">➕ Nuevo Item</button>
      <button id="btnImportarExcel" style="background: #28a745; display: none;">📥 Importar</button>
      <input type="file" id="inputExcel" accept=".xlsx, .xls, .csv" style="display: none;">
    </div>

    <div id="filtrosCategorias" class="categorias-container"></div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div id="sidebarMenu" class="sidebar">
      <button id="btnCambiarRol" class="sidebar-btn sidebar-btn-top">🔄 Cambiar de modo</button>
      <button id="btnGestorCategorias" class="sidebar-btn" style="display: none;">📁 Categorías</button>
      <button id="btnVerClientes" class="sidebar-btn" style="display: none;">👥 Clientes</button>
    </div>

    <div id="modalCategorias" style="display:none;" class="modal">
      <div class="modal-content">
        <h3>📁 Categorías</h3>
        <input id="nuevoNombreCategoria" placeholder="Nueva categoría...">
        <button id="btnGuardarCategoria">Añadir</button>
        <div id="listaCategoriasCrud"></div>
        <button type="button" id="btnCerrarCategorias" class="btn-secundario">Cerrar</button>
      </div>
    </div>

    <div id="agregar" style="display:none" class="modal">
      <div class="modal-content">
        <h3 id="modalTitulo">Nuevo Artículo</h3>
        
        <button id="btnAccionesIA" type="button" style="background: linear-gradient(135deg, #5856d6, #ff2d55); color: white;">✨ Acciones IA</button>
        <div id="menuAccionesIA" style="display:none;">
          <button id="btnCrearFoto">📷 Crear Foto Pro</button>
          <button id="btnMenuFormatear">📦 Formatear Stock</button>
        </div>
        
        <input id="nombre" placeholder="Nombre">
        <select id="categoriaSelect"></select>
        
        <button type="button" id="btnToggleModelo">🚫 Alternar Modo Stock</button>
        
        <div id="cajaFormateador" style="display: none;">
           <textarea id="textoCrudoStock" placeholder="Pegá tu lista de stock..."></textarea>
           <button type="button" id="btnProcesarStock">Convertir Stock 🚀</button>
        </div>

        <input id="stockPorModelo" placeholder="Ej: 13 Pro:5, Blanco:3">
        <input id="stockTotalSencillo" type="number" placeholder="Stock Total" style="display: none;">
        <input id="costo" type="number" placeholder="Costo">
        <input id="venta" type="number" placeholder="Precio Venta">
        <input id="fotoInput" type="file" accept="image/*">
        
        <img id="previewFoto" style="display:none; width: 100px;">
        
        <div id="controlCamposPro" style="display: none;">
          <input type="checkbox" id="toggleFondo" checked> Fondo Estudio
          <input type="range" id="sliderSombra" min="0" max="100" value="35">
          <canvas id="canvasGestos" width="1000" height="1000"></canvas>
        </div>

        <button id="guardarFunda">Guardar</button>
        <button onclick="ocultarFormulario()" class="btn-secundario">Cancelar</button>
      </div>
    </div>

    <div id="modalAsistente" style="display:none;" class="modal">
      <div class="modal-content">
        <h3>🤖 Venta Rápida</h3>
        <input id="asistenteProducto" list="listaProductos" placeholder="Buscar...">
        <datalist id="listaProductos"></datalist>
        <input id="asistenteModelo" placeholder="Variante">
        <input id="asistenteUnidades" type="number" value="1">
        <button id="btnRegistrarVenta">Confirmar Venta 🛒</button>
      </div>
    </div>

    <div id="modalReservar" style="display:none;" class="modal">
      <div class="modal-content">
        <h3>🛒 Añadir al Carrito</h3>
        <p id="reservaNombreFunda"></p>
        <select id="reservaModelo"></select>
        <p>Precio: <span id="reservaPrecio"></span></p>
        <button id="btnConfirmarWhatsApp">Añadir 🛒</button>
        <button onclick="cerrarModalReservar()" class="btn-secundario">Volver</button>
      </div>
    </div>

    <div id="fundas"></div>
    <button id="btnAsistente" class="fab-asistente">💬 Asistente</button>
    <button id="btnAbrirCarrito" style="display:none;">🛒 Mi Pedido (<span id="contadorCarrito">0</span>)</button>

    <div id="modalCarrito" style="display:none;" class="modal">
      <div class="modal-content">
        <h2>Carrito</h2>
        <div id="listaItemsCarrito"></div>
        <h3>Total: <span id="totalCarrito">$0</span></h3>
        <button id="btnComprarWhatsAppCarrito">Enviar Pedido 💬</button>
        <button id="btnCerrarCarrito" class="btn-secundario">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="modalRegistroCliente" style="display:none;" class="modal">
    <div class="modal-content">
      <h3>👋 ¡Bienvenido!</h3>
      <input id="registroNombre" placeholder="Tu Nombre">
      <input id="registroTelefono" type="number" placeholder="WhatsApp">
      <button id="btnRegistrarCliente">Entrar 🚀</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
