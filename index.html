<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iNeo Cases - Stock</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="cargando" style="text-align: center; margin-top: 50px; font-family: sans-serif; font-size: 18px;">
    ⏳ Cargando aplicación...
  </div>

  <div id="login" style="display:none;">
    <div class="login-container">
      <div class="login-welcome">
        <div class="header-logo-welcome">
          <img src="logo.svg" alt="Logo" class="app-logo-welcome">
          <h1>iNeo Cases</h1>
          <p class="subtitle">Descubrí los mejores accesorios premium para tu dispositivo</p>
        </div>
        <button id="btnCliente" class="btn-principal-welcome">Entrar a ver Catálogo 📱</button>
      </div>
      <div class="admin-trigger-zone">
        <button type="button" id="btnAbrirAdminModal" class="btn-link-admin">🔒 Acceso Personal de Trabajo</button>
      </div>
    </div>

    <div id="modalAdminLogin" class="modal-admin-overlay" style="display: none;">
      <div class="modal-admin-content">
        <div class="modal-admin-header">
          <h3>Panel de Administración</h3>
          <p>Ingresá tus credenciales autorizadas</p>
        </div>
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" placeholder="ejemplo@ineocases.com">
        <label for="password">Contraseña de Seguridad</label>
        <input id="password" type="password" placeholder="••••••••">
        <button id="btnLogin" class="btn-admin-submit">Ingresar al Sistema 🔐</button>
        <button type="button" id="btnCerrarAdminModal" class="btn-secundario" style="width: 100%; margin-top: 8px;">Volver atrás</button>
      </div>
    </div>
  </div>

  <div id="app" style="display:none;">
    
    <header class="header-container">
      <div class="header-logo">
        <img src="logo.svg" alt="Logo" class="app-logo">
        <h1>iNeo Cases</h1>
      </div>
      <button id="btnMenuHamburguesa" class="menu-hamburguesa" aria-label="Menú">
        <span></span>
        <span></span>
      </button>
    </header>
    
    <div class="top-bar">
      <input id="buscar" placeholder="Buscar producto o modelo...">
      <button id="btnNuevaFunda" style="white-space: nowrap;">➕ Nuevo Item</button>
      <button id="btnImportarExcel" style="background: #28a745; white-space: nowrap; display: none;">📥 Importar</button>
      <input type="file" id="inputExcel" accept=".xlsx, .xls, .csv" style="display: none;">
    </div>

    <div id="filtrosCategorias" class="categorias-container"></div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div id="sidebarMenu" class="sidebar">
      <div class="sidebar-header" style="display: flex; justify-content: flex-end; padding: 0 20px 20px 0;">
        <button onclick="cerrarMenu()" style="background: #e5e5ea; border-radius: 50%; border:none; width: 40px; height: 40px;">✕</button>
      </div>
      <button id="btnCambiarRol" class="sidebar-btn">🔄 Cambiar de modo</button>
      <button id="btnGestorCategorias" class="sidebar-btn" style="display: none;">📁 Administrar Categorías</button>
    </div>

    <div id="modalCategorias" style="display:none;">
      <div class="modal-content">
        <h3>📁 Administrar Categorías</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
          <input id="nuevoNombreCategoria" placeholder="Nueva categoría...">
          <button id="btnGuardarCategoria">Añadir ➕</button>
        </div>
        <div id="listaCategoriasCrud" style="max-height: 250px; overflow-y: auto; border: 1px solid #d2d2d7; border-radius: 12px; padding: 10px;"></div>
        <button type="button" id="btnCerrarCategorias" class="btn-secundario" style="width: 100%;">Cerrar</button>
      </div>
    </div>

    <div id="agregar" style="display:none">
      <div class="modal-content">
        <h3 id="modalTitulo">Nuevo Artículo</h3>
        <label>Nombre del producto</label>
        <input id="nombre" placeholder="Nombre...">
        <label>Categoría</label>
        <select id="categoriaSelect"></select>
        <label>Modelos y Stock</label>
        <input id="stockPorModelo" placeholder="Ej: 13 Pro:5, Blanco:3">
        <label>Precio de venta ($)</label>
        <input id="venta" type="number" placeholder="0">
        <label>Foto del producto</label>
        <input id="fotoInput" type="file" accept="image/*">
        <div class="modal-buttons">
          <button type="button" onclick="ocultarFormulario()" class="btn-secundario">Cancelar</button>
          <button id="guardarFunda">Guardar</button>
        </div>
      </div>
    </div>

    <div id="fundas"></div>

    <button id="btnAsistente" class="fab-asistente">💬 Asistente</button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
