<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iNeo Cases - Stock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="cargando" style="text-align: center; margin-top: 50px; font-family: Arial; font-size: 18px;">
    ⏳ Cargando aplicación...
  </div>

  <div id="login" style="display:none;">
    <div class="header-logo">
      <img src="logo.svg" alt="Logo" class="app-logo">
      <h2>iNeo Cases</h2>
    </div>
    <input id="email" placeholder="Email o Usuario Admin">
    <input id="password" type="password" placeholder="Contraseña Admin">
    <button id="btnLogin">Ingresar como Admin 🔐</button>
    <button id="btnCliente" class="btn-secundario" style="margin-top: 12px; width: 100%; font-weight: 600;">📱 Entrar como Cliente (Ver Catálogo)</button>
  </div>

  <div id="app" style="display:none;">
    <div class="header-logo">
      <img src="logo.svg" alt="Logo" class="app-logo">
      <h1>iNeo Cases</h1>
    </div>
    
    <div class="top-bar">
      <input id="buscar" placeholder="Buscar iPhone 12, 13...">
      <button id="btnNuevaFunda">➕ Nueva funda</button>
    </div>

    <div id="agregar" style="display:none">
      <div class="modal-content">
        <h3 id="modalTitulo">Nueva Funda</h3>
        
        <label>Nombre del modelo/diseño</label>
        <input id="nombre" placeholder="Ej: Funda Silicona Púrpura">
        
        <label>Modelos y Stock (Formato: modelo:cantidad)</label>
        <input id="stockPorModelo" placeholder="Ej: 11:3, 12:1, 14:4">
        
        <label>Costo de lista ($)</label>
        <input id="costo" type="number" placeholder="0">
        
        <label>Precio de venta ($)</label>
        <input id="venta" type="number" placeholder="0">

        <label>Foto del producto</label>
        <input id="fotoInput" type="file" accept="image/*" style="padding: 8px;">
        <img id="previewFoto" src="" alt="Vista previa" style="display:none; width: 100px; height: 100px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; border: 1px solid #d2d2d7;">
        
        <div class="modal-buttons">
          <button type="button" onclick="ocultarFormulario()" class="btn-secundario">Cancelar</button>
          <button id="guardarFunda">Guardar</button>
        </div>
      </div>
    </div>  

    <div id="modalAsistente" style="display:none;">
      <div class="modal-content">
        <h3>🤖 Asistente Virtual de Ventas</h3>
        <p style="color:#6e6e73; font-size:14px; margin-bottom:15px;">Registra una venta rápidamente indicando los datos aquí debajo:</p>
        
        <label>Nombre del producto</label>
        <input id="asistenteProducto" list="listaProductos" placeholder="Escribe para buscar la funda...">
        <datalist id="listaProductos"></datalist>

        <label>Modelo de iPhone vendido</label>
        <input id="asistenteModelo" placeholder="Ej: 12, 14 Pro, 11">

        <label>Unidades vendidas</label>
        <input id="asistenteUnidades" type="number" value="1" min="1">

        <div class="modal-buttons">
          <button type="button" onclick="ocultarAsistente()" class="btn-secundario">Cerrar</button>
          <button id="btnRegistrarVenta">Confirmar Venta 🛒</button>
        </div>
      </div>
    </div>

    <div id="modalReservar" style="display:none;">
      <div class="modal-content">
        <h3>🛍️ Menú de Reserva</h3>
        <p id="reservaNombreFunda" style="font-weight: 700; font-size: 18px; margin-bottom: 15px; color: #1d1d1f;"></p>
        
        <label>Seleccioná tu modelo de iPhone</label>
        <select id="reservaModelo" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #d2d2d7; margin-bottom: 20px; font-size: 15px; background: white;"></select>
        
        <p style="font-size: 17px; color:#0071e3; font-weight:700; margin-bottom: 20px;">Precio: <span id="reservaPrecio"></span></p>
        
        <div class="modal-buttons">
          <button type="button" onclick="cerrarModalReservar()" class="btn-secundario">Volver</button>
          <button id="btnConfirmarWhatsApp" style="background: #25D366; color: white; font-weight: 600;">Confirmar en WhatsApp 💬</button>
        </div>
      </div>
    </div>

    <div id="fundas"></div>

    <button id="btnAsistente" class="fab-asistente">💬 Asistente de Ventas</button>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
