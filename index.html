<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IneoCases Stock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login">
        <h2>IneoCases Stock</h2>
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Contraseña">
        <button id="btnLogin">Ingresar</button>
    </div>

    <div id="app" style="display:none;">
        <h1>📱 IneoCases Stock</h1>
        
        <div id="panel">
            <h2>📊 Resumen</h2>
            <div style="display: flex; gap: 20px; flex-wrap: wrap;">
                <p>💰 Ganancia hoy: <strong id="gananciaHoy">$0.00</strong></p>
                <p>📦 Stock total: <strong id="stockTotal">0</strong></p>
                <p>🛒 Ventas del mes: <strong id="ventasMes">0</strong></p>
            </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="buscarNombre" placeholder="Buscar por nombre..." style="flex: 1;">
            <input type="text" id="buscarModelo" placeholder="Buscar modelo (ej: 11)..." style="flex: 1;">
        </div>
        
        <button id="btnNuevaFunda">➕ Nueva funda</button>

        <div id="agregar" style="display:none">
            <input id="nombre" placeholder="Nombre de la funda">
            <input id="stock" type="number" placeholder="Stock disponible">
            <input id="compatibles" placeholder="Modelos (separados por comas: 11, 12, 13)">
            <input id="costo" type="number" placeholder="Precio de costo">
            <input id="venta" type="number" placeholder="Precio de venta">
            <button id="guardarFunda">Guardar Funda</button>
        </div>  

        <div id="fundas"></div>

        <hr style="margin: 40px 0;">
        <h2>📜 Historial de Ventas</h2>
        <div id="historial"></div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
