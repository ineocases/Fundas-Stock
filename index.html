<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IneoCases Stock</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="cargando" style="text-align: center; margin-top: 50px; font-family: Arial; font-size: 18px;">
    ⏳ Cargando aplicación...
  </div>

  <div id="login" style="display:none;">
    <h2>IneoCases Stock</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Contraseña">
    <button id="btnLogin">Ingresar</button>
  </div>

  <div id="app" style="display:none;">
    <h1>📱 IneoCases Stock</h1>
    <div class="top-bar">
      <input id="buscar" placeholder="Buscar iPhone 12, 13...">
      <button id="btnNuevaFunda">➕ Nueva funda</button>
    </div>

    <div id="agregar" style="display:none">
      <div class="modal-content">
        <h3 id="modalTitulo">Nueva Funda</h3>
        
        <label>Nombre del modelo</label>
        <input id="nombre" placeholder="Ej: Clear Case con MagSafe">
        
        <label>Stock disponible</label>
        <input id="stock" type="number" placeholder="0">
        
        <label>Modelos compatibles (separados por coma)</label>
        <input id="compatibles" placeholder="11, 12, 13, 14 Pro">
        
        <label>Costo de lista ($)</label>
        <input id="costo" type="number" placeholder="0">
        
        <label>Precio de venta ($)</label>
        <input id="venta" type="number" placeholder="0">
        
        <div class="modal-buttons">
          <button id="btnCancelar" class="btn-secundario">Cancelar</button>
          <button id="guardarFunda">Guardar</button>
        </div>
      </div>
    </div>  
    
    <div id="fundas"></div>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
