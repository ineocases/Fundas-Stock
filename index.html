<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iNeo Cases - Stock</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="cargando" style="text-align: center; margin-top: 50px; font-family: Arial; font-size: 18px;">
    ⏳ Cargando aplicación...
  </div>

  <div id="login" style="display:none;">
    <div class="login-container">
      <div class="login-welcome">
        <div class="header-logo-welcome">
          <img src="logo.svg" alt="Logo" class="app-logo-welcome">
          <h1>iNeo Cases</h1>
          <p class="subtitle">Descubrí las mejores fundas premium para tu iPhone</p>
        </div>
        
        <button id="btnCliente" class="btn-principal-welcome">Entrar a ver Catálogo 📱</button>
      </div>
      
      <div class="admin-trigger-zone">
        <button type="button" id="btnAbrirAdminModal" class="btn-link-admin">🔒 Acceso Personal de Trabajo</button>
      </div>
    </div>

    <div id="modalAdminLogin" class="modal-admin-overlay" style="display: none;">
      <div class="modal-admin-content">
        <div class="modal-admin-header">
          <h3>Panel de Administración</h3>
          <p>Ingresá tus credenciales autorizadas</p>
        </div>
        
        <div class="modal-admin-body">
          <label for="email">Correo Electrónico</label>
          <input id="email" type="email" placeholder="ejemplo@ineocases.com" autocomplete="email">
          
          <label for="password">Contraseña de Seguridad</label>
          <input id="password" type="password" placeholder="••••••••">
          
          <div class="modal-admin-buttons">
            <button id="btnLogin" class="btn-admin-submit">Ingresar al Sistema 🔐</button>
            <button type="button" id="btnCerrarAdminModal" class="btn-secundario" style="width: 100%; margin-top: 8px;">Volver atrás</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="app" style="display:none;">
    <div class="header-logo">
      <img src="logo.svg" alt="Logo" class="app-logo">
      <h1>iNeo Cases</h1>
    </div>
    
    <div class="top-bar">
      <input id="buscar" placeholder="Buscar iPhone 12, 13...">
      <button id="btnNuevaFunda" style="white-space: nowrap;">➕ Nueva</button>
      
      <button id="btnMenuHamburguesa" class="menu-hamburguesa" aria-label="Menú">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>

    <div id="sidebarOverlay" class="sidebar-overlay"></div>
    <div id="sidebarMenu" class="sidebar">
      <button id="btnCambiarRol" class="sidebar-btn">🔄 Cambiar de modo</button>
    </div>

    <div id="agregar" style="display:none">
      <div class="modal-content">
        <h3 id="modalTitulo">Nueva Funda</h3>
        
        <label>Nombre del modelo/diseño</label>
        <input id="nombre" placeholder="Ej: Funda Silicona Púrpura">
        
        <label>Modelos y Stock (Formato: modelo:cantidad)</label>
        <input id="stockPorModelo" placeholder="Ej: 11:3, 12:1, 14:4">
        
        <label>Costo de lista ($)</label>
        <input id="costo" type="number" placeholder="0">
        
        <label>Precio de venta ($)</label>
        <input id="venta" type="number" placeholder="0">

        <label>Foto del producto</label>
        <input id="fotoInput" type="file" accept="image/*" style="padding: 8px;">
        
        <img id="previewFoto" alt="Vista previa" style="display:none; width: 150px; height: 150px; object-fit: contain; border-radius: 10px; margin-bottom: 15px; border: 1px solid #d2d2d7;">
        
        <div id="controlCamposPro" style="display: none; margin: 15px 0; font-family: -apple-system, sans-serif;">
          <div style="text-align: center; margin-bottom: 12px;">
            <label for="sliderEscala" style="font-weight: 600; color: #1d1d1f; display: block; margin-bottom: 5px;">
              📏 Tamaño de la funda: <span id="valorEscala">72%</span>
            </label>
            <input type="range" id="sliderEscala" min="40" max="95" value="72" style="width: 80%; max-width: 300px; accent-color: #0071e3;">
          </div>

          <div style="text-align: center;">
            <label for="sliderRotacion" style="font-weight: 600; color: #1d1d1f; display: block; margin-bottom: 5px;">
              🔄 Rotación de la funda: <span id="valorRotacion">0°</span>
            </label>
            <input type="range" id="sliderRotacion" min="-180" max="180" value="0" style="width: 80%; max-width: 300px; accent-color: #5856d6;">
          </div>
        </div>
        
        <div class="modal-buttons">
          <button type="button" id="btnCrearFoto" style="background: #5856d6; color: white;">Crear foto Pro</button>
          <button type="button" onclick="ocultarFormulario()" class="btn-secundario">Cancelar</button>
          <button id="guardarFunda">Guardar</button>
        </div>
      </div>
    </div>  

    <div id="modalAsistente" style="display:none;">
      <div class="modal-content">
        <h3>🤖 Asistente Virtual de Ventas</h3>
        <p style="color:#6e6e73; font-size:14px; margin-bottom:15px;">Registra una venta rápidamente:</p>
        
        <label>Nombre del producto</label>
        <input id="asistenteProducto" list="listaProductos" placeholder="Escribe para buscar la funda...">
        <datalist id="listaProductos"></datalist>

        <label>Modelo de iPhone vendido</label>
        <input id="asistenteModelo" placeholder="Ej: 12, 14 Pro, 11">

        <label>Unidades vendidas</label>
        <input id="asistenteUnidades" type="number" value="1" min="1">

        <div class="modal-buttons">
          <button type="button" onclick="ocultarAsistente()" class="btn-secundario">Cerrar</button>
          <button id="btnRegistrarVenta">Confirmar Venta 🛒</button>
        </div>
      </div>
    </div>

    <div id="modalReservar" style="display:none;">
      <div class="modal-content">
        <h3>🛍️ Menú de Reserva</h3>
        <p id="reservaNombreFunda" style="font-weight: 700; font-size: 18px; margin-bottom: 15px; color: #1d1d1f;"></p>
        
        <label>Seleccioná tu modelo de iPhone</label>
        <select id="reservaModelo" style="width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #d2d2d7; margin-bottom: 20px; font-size: 15px; background: white;"></select>
        
        <p style="font-size: 17px; color:#0071e3; font-weight:700; margin-bottom: 20px;">Precio: <span id="reservaPrecio"></span></p>
        
        <div class="modal-buttons">
          <button type="button" onclick="cerrarModalReservar()" class="btn-secundario">Volver</button>
          <button id="btnConfirmarWhatsApp" style="background: #25D366; color: white; font-weight: 600;">Confirmar en WhatsApp 💬</button>
        </div>
      </div>
    </div>

    <div id="fundas"></div>

    <button id="btnAsistente" class="fab-asistente">💬 Asistente de Ventas</button>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
